<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>클린룸 듀오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: 한 화면 고정 — 얇은 상태바 / [1P 패드 | 클린룸 화면 | 2P 패드] */
:root{
  --bg:#121824; --panel:#1b2332; --panel2:#222c3e; --line:#2f3b52;
  --fg:#e9eef5; --muted:#93a1b8;
  --amber:#f2c14e; --teal:#3fc1a5; --red:#ec6a5e;
  --p1:#6fa8ff; --p2:#ff8fb3;
  --f-display:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-pix:'Silkscreen','Courier New',monospace;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.4;
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-block:8px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;gap:8px;max-width:1500px;margin:0 auto}

/* status bar */
.hud{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.pp{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 10px;min-width:0;height:40px}
.pp.p2{flex-direction:row-reverse}
.tag{font-family:var(--f-pix);font-size:11px;padding:1px 6px;border-radius:3px;color:#0e131d;flex:none}
.p1 .tag{background:var(--p1)} .p2 .tag{background:var(--p2)}
.pp canvas{width:26px;height:26px;image-rendering:pixelated;flex:none}
.hold{font-family:var(--f-display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.board{display:flex;align-items:center;gap:14px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 12px;height:40px}
.st{display:flex;align-items:baseline;gap:4px}
.st i{font-style:normal;font-size:12px;color:var(--muted)}
.st b{font-family:var(--f-pix);font-weight:400;font-size:18px;font-variant-numeric:tabular-nums}
.st.time b{color:var(--amber)} .st.star b,.st.star i{color:var(--amber)} .st.bad b{color:var(--red)}
.st[hidden]{display:none}
.icon{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:34px;height:30px;font-family:var(--f-pix);font-size:13px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.icon svg{width:20px;height:20px;flex:none}
.icon.snd-btn{color:var(--amber);border-color:#5a4a1a;font-family:var(--f-display);font-size:15px}
.icon.snd-btn.off{color:var(--muted);border-color:var(--line)}

/* main */
.main{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"p1 stage p2";gap:10px;align-items:center}
.stage{grid-area:stage;min-width:0;min-height:0;height:100%;display:grid;place-items:center}
.screen{position:relative;border:2px solid #36435c;border-radius:6px;overflow:hidden;background:#0b0f17;max-width:100%}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated}
.pad{display:flex;flex-direction:column;gap:12px;align-items:center;touch-action:none}
.pad[hidden]{display:none}
.pad.p1{grid-area:p1} .pad.p2{grid-area:p2}
.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:4px}
.dpad button,.act{background:var(--panel2);border:1px solid var(--line);border-radius:8px;font-size:17px;touch-action:none;padding:0}
.dpad button.on,.act.on{background:#3a4a68}
.u{grid-column:2;grid-row:1}.l{grid-column:1;grid-row:2}.r{grid-column:3;grid-row:2}.dn{grid-column:2;grid-row:3}
.act{width:76px;height:76px;border-radius:50%;font-family:var(--f-display);font-size:18px}
.pad.p1 .act{border:2px solid var(--p1)} .pad.p2 .act{border:2px solid var(--p2)}
.padtag{font-family:var(--f-pix);font-size:11px}
.p1 .padtag{color:var(--p1)} .p2 .padtag{color:var(--p2)}
@media (max-aspect-ratio:1/1){
  .main{grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"stage stage" "p1 p2"}
  .pad{flex-direction:row;justify-content:center}
  .pad.p2{flex-direction:row-reverse}
}

/* sound panel */
.snd{position:fixed;z-index:40;top:56px;left:50%;transform:translateX(-50%);width:min(300px,calc(100vw - 32px));background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.snd[hidden]{display:none}
.snd b{font-family:var(--f-display);font-weight:400;font-size:18px}
.sl{display:grid;grid-template-columns:52px 1fr 34px;gap:8px;align-items:center;font-size:13px}
.sl output{font-family:var(--f-pix);font-size:11px;color:var(--amber);text-align:right}
.sl input{width:100%;accent-color:#f2c14e}
.snd .row button{flex:1}
.psnd{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;text-align:left}
.psnd b{font-family:var(--f-display);font-weight:400;font-size:18px}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(12,16,25,.94);display:grid;place-items:center;overflow:auto;z-index:20;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov[hidden]{display:none!important}
.box{max-width:720px;width:100%;display:flex;flex-direction:column;gap:clamp(10px,2.2vh,18px)}
.kicker{font-family:var(--f-pix);font-size:11px;letter-spacing:.12em;color:var(--amber)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,8vh,64px);line-height:1;margin:0}
h1 em{font-style:normal;color:var(--amber)}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,5vh,40px);line-height:1.1;margin:0}
.lead{font-size:clamp(14px,2.2vh,17px);margin:0;color:#d5dce8}
.flow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:center}
.fl{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;text-align:center;font-family:var(--f-display);font-size:clamp(15px,2.3vh,18px)}
.fl small{display:block;font-family:var(--f-pix);font-size:10px;color:var(--amber)}
.ar{color:var(--amber);font-size:18px}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cc{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;text-align:left;font:inherit;color:inherit;cursor:default}
.ctrl.pick .cc{cursor:pointer}
.ctrl.pick .cc.sel{border-color:var(--amber);background:#2a2a22}
.ctrl.pick .cc:not(.sel){opacity:.6}
.seg{display:inline-flex;align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px}
.seg button{background:transparent;border:0;border-radius:6px;padding:6px 16px;font-family:var(--f-display);font-size:17px;color:var(--muted)}
.seg button.on{background:var(--amber);color:#1a1405}
.pp.off{visibility:hidden}
.cc canvas{width:33px;height:48px;image-rendering:pixelated;flex:none}
.cc b{font-family:var(--f-display);font-weight:400;font-size:17px;display:block}
.cc span{font-size:13px;color:var(--muted)}
kbd{font-family:var(--f-pix);font-size:10.5px;background:#0e131d;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--fg)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px 14px;text-align:left;display:flex;flex-direction:column;gap:2px}
.mode:hover{border-color:var(--amber)}
.mode b{font-family:var(--f-display);font-weight:400;font-size:22px}
.mode span{font-size:13px;color:var(--muted)}
.mode.primary{background:var(--amber);color:#1a1405;border-color:var(--amber)} .mode.primary span{color:#4a3a0c}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 12px;font-size:13px}
.go{background:var(--amber);color:#1a1405;border:0;border-radius:6px;padding:9px 18px;font-weight:600;font-size:15px}
.go.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.res{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.grade{font-family:var(--f-pix);font-size:clamp(40px,9vh,64px);line-height:1;color:var(--amber)}
.steps{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.sc{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:5px;padding:5px 4px;text-align:center;min-width:0}
.sc b{font-family:var(--f-display);font-weight:400;font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc span{font-size:12px;color:var(--amber);letter-spacing:-1px;display:block}
.sc em{font-style:normal;font-size:10px;color:#1a1405;background:var(--amber);border-radius:3px;padding:0 4px}
@media (max-width:640px){.ctrl,.modes{grid-template-columns:1fr}.steps{grid-template-columns:repeat(4,minmax(0,1fr))}.flow{grid-template-columns:1fr}.ar{display:none}}
@media (max-height:560px){.ctrl{display:none}}
</style>

<div class="app">
  <header class="hud">
    <div class="pp p1"><span class="tag">1P</span><canvas id="hi0" width="48" height="48"></canvas><span class="hold" id="hold0">빈손</span></div>
    <div class="board">
      <span class="st time"><b id="sTime">00:00</b></span>
      <span class="st"><i>칩</i><b id="sShip">0</b></span>
      <span class="st star"><i>★</i><b id="sStar">0</b></span>
      <span class="st bad" id="sBadW" hidden=""><i>불량</i><b id="sBad">0</b></span>
      <button class="icon snd-btn" id="btnSnd" aria-label="소리 조절"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z" fill="currentColor"></path><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"></path></svg><span>소리</span></button><button class="icon" id="btnPause" aria-label="일시정지">II</button>
    </div>
    <div class="pp p2"><span class="tag">2P</span><canvas id="hi1" width="48" height="48"></canvas><span class="hold" id="hold1">빈손</span></div>
  </header>
  <main class="main" id="main">
    <div class="pad p1" data-p="0" hidden="">
      <span class="padtag">1P</span>
      <div class="dpad"><button class="u" data-k="up" aria-label="1P 위">▲</button><button class="l" data-k="left" aria-label="1P 왼쪽">◀</button><button class="r" data-k="right" aria-label="1P 오른쪽">▶</button><button class="dn" data-k="down" aria-label="1P 아래">▼</button></div>
      <button class="act" data-k="act">작업</button>
    </div>
    <div class="stage" id="stage"><div class="screen" id="screen" style="width: 1036px; height: 622px;"><canvas id="cv" width="1280" height="768"></canvas></div></div>
    <div class="pad p2" data-p="1" hidden="">
      <span class="padtag">2P</span>
      <div class="dpad"><button class="u" data-k="up" aria-label="2P 위">▲</button><button class="l" data-k="left" aria-label="2P 왼쪽">◀</button><button class="r" data-k="right" aria-label="2P 오른쪽">▶</button><button class="dn" data-k="down" aria-label="2P 아래">▼</button></div>
      <button class="act" data-k="act">작업</button>
    </div>
  </main>
</div>

<div class="snd" id="snd" hidden="">
  <b>소리 조절</b>
  <label class="sl"><span>배경음</span><input type="range" id="volBgm" min="0" max="100" value="50"><output id="vBgm">50</output></label>
  <label class="sl"><span>효과음</span><input type="range" id="volSfx" min="0" max="100" value="80"><output id="vSfx">80</output></label>
  <div class="row"><button class="chip" id="btnMute">모두 끄기</button><button class="chip" id="sndClose">닫기</button></div>
</div>
<div class="ov" id="ovStart">
  <div class="box">
    <div class="kicker">SEMICONDUCTOR FAB · 2P CO-OP</div>
    <h1>클린룸 <em>듀오</em></h1>
    <p class="lead" id="lead">두 연구원이 웨이퍼를 주고받으며 <b>8단계 공정 미션</b>을 풀어 반도체 칩을 완성해요. 둘이 힘을 합쳐야 하는 <b>함께 미션</b>도 있어요.</p>
    <div class="flow">
      <div class="fl"><small>1</small>웨이퍼 옮기기</div><span class="ar">→</span>
      <div class="fl"><small>2</small>공정 알아보고 미션 해결</div><span class="ar">→</span>
      <div class="fl"><small>3</small>칩 출하</div>
    </div>
    <div class="seg" role="group" aria-label="인원 선택"><button id="n2" class="on" type="button">2인 협동</button><button id="n1" type="button">1인</button></div>
    <div class="ctrl" id="ctrl">
      <button class="cc sel" id="cc0" type="button"><canvas id="pv0" width="22" height="32"></canvas><div><b id="ccT0">1P · 왼쪽 방</b><span id="ccD0"><kbd>WASD</kbd> 이동 · <kbd>E</kbd> 또는 <kbd>L-Shift</kbd> 작업</span></div></button>
      <button class="cc sel" id="cc1" type="button"><canvas id="pv1" width="22" height="32"></canvas><div><b id="ccT1">2P · 오른쪽 방</b><span id="ccD1"><kbd>방향키</kbd> 이동 · <kbd>Space</kbd> 작업</span></div></button>
    </div>
    <div class="modes">
      <button class="mode primary" id="btnPractice"><b>연습 모드</b><span>화살표 안내 · 칩 1개 완성하기</span></button>
      <button class="mode" id="btnChallenge"><b>도전 모드</b><span>목표: 5분 안에 반도체 칩을 최대한 많이 완성하기</span><span>안내 없음 · 순서 틀리면 불량</span></button>
    </div>
    <div class="row"><button class="chip" id="btnPad">터치 패드 켜기</button><button class="chip" id="btnSnd2">🔊 소리 조절</button></div>
  </div>
</div>

<div class="ov" id="ovPause" hidden="">
  <div class="box" style="align-items:center;text-align:center;max-width:420px">
    <h2>일시정지</h2>
    <div class="psnd">
      <b>소리 조절</b>
      <label class="sl"><span>배경음</span><input type="range" id="pBgm" min="0" max="100" value="50"><output id="pvBgm">50</output></label>
      <label class="sl"><span>효과음</span><input type="range" id="pSfx" min="0" max="100" value="80"><output id="pvSfx">80</output></label>
      <button class="chip" id="pMute">모두 끄기</button>
    </div>
    <div class="row" style="justify-content:center"><button class="go" id="pResume">계속하기</button><button class="go ghost" id="pMenu">처음 화면</button></div>
  </div>
</div>

<div class="ov" id="ovEnd" hidden="">
  <div class="box">
    <div class="kicker" id="eKick">REPORT</div>
    <div class="res"><div class="grade" id="eGrade">A</div><div><h2 id="eTitle">완료!</h2><p class="lead" id="eLead"></p></div></div>
    <div class="steps" id="eSteps"></div>
    <div class="row"><button class="go" id="eAgain">다시 하기</button><button class="go ghost" id="eMenu">처음 화면</button></div>
  </div>
</div>

// ---------- audio ----------
let AC=null,muted=false,bgmG=null,sfxG=null,noiseBuf=null,vol={bgm:50,sfx:80};
try{const v=JSON.parse(localStorage.getItem('cleanroomDuoVol')||'null');if(v){vol=Object.assign(vol,v);}}catch(e){}
function applyVol(){if(!AC)return;const t=AC.currentTime;bgmG.gain.setTargetAtTime(muted?0:vol.bgm/100,t,.05);sfxG.gain.setTargetAtTime(muted?0:vol.sfx/100,t,.05);}
function audioOn(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();
    bgmG=AC.createGain();sfxG=AC.createGain();bgmG.connect(AC.destination);sfxG.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*.05,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    applyVol();startMusic();}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function tone(f,d,type,delay=0,v=.05){if(!AC)return;const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v*1.4,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(sfxG);o.start(t);o.stop(t+d+.02);}
// ---- background music: original 8-bit loop (C - Am - F - G) ----
const MEL=[72,76,79,76,72,76,79,84, 81,79,76,72,74,76,72,0, 77,81,84,81,77,76,74,72, 74,76,79,83,81,79,74,0,
           76,79,84,79,76,72,74,76, 81,84,81,76,72,74,76,0, 77,76,74,72,74,77,81,79, 79,77,74,71,72,0,0,0];
const BASS=[[48,55,52,55],[45,52,48,52],[41,48,45,48],[43,50,47,50]];
const midi=n=>440*Math.pow(2,(n-69)/12);
let musStep=0,musNext=0,musTimer=null;const EIGHTH=60/132/2;
function note(f,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.01);g.gain.setTargetAtTime(0,t+d*.6,d*.25);o.connect(g).connect(bgmG);o.start(t);o.stop(t+d+.1);}
function hat(t,v){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;f.type='highpass';f.frequency.value=6000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.04);s.connect(f).connect(g).connect(bgmG);s.start(t);s.stop(t+.05);}
function schedule(){
  if(!AC)return;
  if(musNext<AC.currentTime)musNext=AC.currentTime+.05;
  while(musNext<AC.currentTime+.25){
    const i=musStep%64,bar=Math.floor(i/8)%4,t=musNext;
    if(MEL[i])note(midi(MEL[i]),t,EIGHTH*.9,'square',.05);
    if(i%2===0)note(midi(BASS[bar][(i%8)/2]),t,EIGHTH*1.8,'triangle',.13);
    hat(t,i%2?.035:.015);
    musStep++;musNext+=EIGHTH;
  }
}
function startMusic(){if(musTimer)return;musNext=AC.currentTime+.1;musTimer=setInterval(schedule,40);}
function sfx(k){
  if(k==='pick')tone(620,.06,'square');
  else if(k==='put')tone(420,.06,'square');
  else if(k==='good')tone(880,.07,'triangle');
  else if(k==='ready')tone(700,.08,'square',0,.04);
  else if(k==='miss')tone(180,.18,'sawtooth',0,.04);
  else if(k==='done')[659,784,1046].forEach((f,i)=>tone(f,.12,'triangle',i*.08));
  else if(k==='bad')tone(140,.3,'sawtooth',0,.05);
  else if(k==='call'){tone(988,.08,'square',0,.04);tone(988,.08,'square',.14,.04);}
  else if(k==='ship')[523,659,784,1046,1318].forEach((f,i)=>tone(f,.14,'triangle',i*.08));
}

function buildSolid(){
  solid=[];
  for(let y=0;y<ROWS;y++){solid[y]=[];for(let x=0;x<COLS;x++)solid[y][x]=y<2||y===ROWS-1||x===0||x===COLS-1||((x===9||x===10)&&!(G.solo&&(y===5||y===6)));}
  for(const o of G.objs)for(let y=o.ty;y<o.ty+o.h;y++)for(let x=o.tx;x<o.tx+o.w;x++)solid[y][x]=true;
}

const rect=(c,x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h);};
function txt(c,s,x,y,size,col,align='center',font='"Do Hyeon", sans-serif'){c.font=size+'px '+font;c.fillStyle=col;c.textAlign=align;c.textBaseline='middle';c.fillText(s,x,y);}
function wrap(c,s,x,y,maxW,lh,size,col){
  c.font=size+'px "Do Hyeon", sans-serif';const out=[];let line='';
  for(const w of s.split(' ')){const t=line?line+' '+w:w;if(c.measureText(t).width>maxW&&line){out.push(line);line=w;}else line=t;}
  out.push(line);out.forEach((l,i)=>txt(c,l,x,y+i*lh,size,col,'left'));return out.length;
}
function say(p,text,color){G.msgs.push({x:Math.min(LW-40,Math.max(40,p.x)),y:Math.max(22,p.y-42),text,color:color||'#ffffff',t:0});}
function sayAt(x,y,text,color){G.msgs.push({x:Math.min(LW-40,Math.max(40,x)),y:Math.max(22,y),text,color,t:0});}
function roomOf(n){return PROC[n].room==='A'?0:1;}
function mine(n,p){return G.solo||roomOf(n)===p.id;}
function fmtTime(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function needs(i,pid){if(G.solo||i.defect)return true;if(i.stage>=8)return pid===1;return roomOf(i.stage+1)===pid;}
function waferExists(){return players.some(p=>p.item||(p.mission&&p.mission.owner===p.id))||G.objs.some(o=>o.items.length);}
function canSupply(){return G.mode!=='practice'||!waferExists();}
const objOf=fn=>G.objs.find(fn);
function passFor(p){const ps=G.objs.filter(o=>o.type==='pass'&&o.items.length<2);if(!ps.length)return null;return ps.sort((a,b)=>Math.abs(a.y+16-p.y)-Math.abs(b.y+16-p.y))[0];}
function guideFor(p){
  if(p.mission)return {o:null,t:p.mission.owner===p.id?'미션 해결 중!':'함께 미션 중!',wait:true};
  if(G.pending.some(m=>m.owner!==p.id))return {o:null,t:'곧 함께 미션!',wait:true};
  const it=p.item;
  if(it){
    if(it.defect)return {o:objOf(o=>o.type==='scrap'&&(G.solo?roomOf(Math.max(1,it.stage))===o.side:o.side===p.id)),t:'폐기함에 버리기'};
    if(it.stage>=8)return (p.id||G.solo)?{o:objOf(o=>o.type==='ship'),t:'출하대로!'}:{o:passFor(p),t:'패스박스에 넣기'};
    const n=it.stage+1;
    if(mine(n,p))return {o:objOf(o=>o.step===n),t:CIRC[n]+' '+PROC[n].name+' 장비로'};
    return {o:passFor(p),t:'패스박스에 넣기'};
  }
  const pb=objOf(o=>o.type==='pass'&&o.items.some(i=>needs(i,p.id)));
  if(pb)return {o:pb,t:'패스박스에서 꺼내기'};
  if(p.id===0&&canSupply())return {o:objOf(o=>o.type==='supply'),t:'잉곳 꺼내기'};
  return {o:null,t:'기다리기',wait:true};
}
function frontPoint(p){switch(p.dir){case 'up':return [p.x,p.y-14];case 'down':return [p.x,p.y+10];case 'left':return [p.x-13,p.y-5];default:return [p.x+13,p.y-5];}}
function targetOf(p){
  const [fx,fy]=frontPoint(p);
  for(const o of G.objs)if(fx>=o.x-3&&fx<=o.x+o.pw+3&&fy>=o.y-3&&fy<=o.y+o.ph+3)return o;
  let best=null,bd=16;const cy=p.y-6;
  for(const o of G.objs){const dx=Math.max(o.x-p.x,0,p.x-(o.x+o.pw)),dy=Math.max(o.y-cy,0,cy-(o.y+o.ph)),d=Math.hypot(dx,dy);if(d<bd){bd=d;best=o;}}
  return best;
}
function setPose(p,pose,t){p.pose=pose;p.poseT=t;}

// ---------- interactions ----------
function interact(p){
  const o=targetOf(p);
  if(!o){say(p,'장비 가까이에서 눌러요','#c9d2e0');return;}
  const it=p.item;
  if(o.type==='supply'){
    if(it){say(p,'손이 꽉 찼어요');return;}
    if(!canSupply()){say(p,'웨이퍼는 한 장씩!','#f2c14e');return;}
    p.item={kind:'ingot',stage:0,defect:false};sfx('pick');return;
  }
  if(o.type==='pass'){
    if(it){if(o.items.length>=2){say(p,'가득 찼어요','#ec6a5e');return;}o.items.push(it);p.item=null;sfx('put');o.flash=.4;return;}
    if(o.items.length){let k=o.items.findIndex(i=>needs(i,p.id));if(k<0)k=0;p.item=o.items.splice(k,1)[0];sfx('pick');return;}
    say(p,'비어 있어요','#c9d2e0');return;
  }
  if(o.type==='scrap'){if(!it){say(p,'폐기함','#c9d2e0');return;}p.item=null;sfx('put');say(p,'폐기 완료','#c9d2e0');return;}
  if(o.type==='ship'){
    if(it&&it.kind==='chip'&&!it.defect){
      p.item=null;G.shipped++;sfx('ship');o.flash=1;sayAt(o.x+o.pw/2,o.y-6,'출하 완료!','#3fc1a5');
      players.forEach(q=>{if(!q.mission)setPose(q,'cheer',1.4);});
      if(G.mode==='practice'){const g=G;setTimeout(()=>{if(G===g)endGame();},1300);}
      return;}
    say(p,it?'완성 칩만 출하해요':'완성 칩을 가져와요','#ec6a5e');return;
  }
  if(o.type==='station'){
    const P=PROC[o.step];
    if(o.user!=null){say(p,'사용 중','#c9d2e0');return;}
    if(!it){say(p,P.name+' 장비','#c9d2e0');return;}
    if(it.defect){say(p,'불량품은 폐기함으로','#ec6a5e');return;}
    if(it.stage!==o.step-1){
      if(G.mode==='practice'){setPose(p,'point',.8);sfx('miss');say(p,it.stage>=8?'출하대로 가요':'순서가 아니에요 → '+CIRC[it.stage+1],'#f2c14e');}
      else{it.defect=true;G.defects++;sfx('bad');say(p,'순서 오류! 불량 발생','#ec6a5e');}
      return;
    }
    startMission(p,o,it);
  }
}

// ---------- missions ----------
function good(m){m.prog++;sfx('good');if(m.prog>=m.need)complete(m);}
function miss(m,text){m.mist++;m.shake=.3;m.msg=text;m.msgT=1.1;sfx('miss');}
function complete(m){m.done=true;m.doneT=0;m.stars=m.mist===0?3:m.mist<=2?2:1;sfx('done');}
const rnd=(a,b)=>a+Math.random()*(b-a);
function pickN(n,k){const a=[...Array(n).keys()].sort(()=>Math.random()-.5);return a.slice(0,k).sort((x,y)=>x-y);}
const eq=(a,b)=>a[0]===b[0]&&a[1]===b[1];
function gauge(c,x,y,h,val,min,max,lo,hi,label,col){
  const ty=t=>y+h-(t-min)/(max-min)*h;
  rect(c,x,y,14,h,'#26303f');rect(c,x,ty(hi),14,ty(lo)-ty(hi),'#2e8a74');
  rect(c,x-3,ty(val)-1,20,2,'#f1f4f8');
  txt(c,label,x+7,y+h+8,7,col);
}
function waferDisc(c,cx,cy,r,col){c.beginPath();c.arc(cx,cy,r+2,0,Math.PI*2);c.fillStyle='#3a4558';c.fill();c.beginPath();c.arc(cx,cy,r,0,Math.PI*2);c.fillStyle=col;c.fill();}
function drawGrid(c,m,A,paths){
  const s=22,gx=A.x+(A.w-7*s)/2,gy=A.y+(A.h-4*s)/2-4,ce=q=>[gx+q[0]*s+s/2,gy+q[1]*s+s/2];
  for(let y=0;y<4;y++)for(let x=0;x<7;x++)rect(c,gx+x*s+s/2-1,gy+y*s+s/2-1,2,2,'#3a4660');
  for(const b of m.bl){rect(c,gx+b[0]*s+2,gy+b[1]*s+2,s-4,s-4,'#2a3346');for(let i=0;i<3;i++)rect(c,gx+b[0]*s+5,gy+b[1]*s+6+i*4,s-10,1,'#46536a');}
  for(const q of m.ct){const [x,y]=ce(q);rect(c,x-5,y-5,10,10,'#e06cab');}
  for(const [path,col] of paths){
    c.strokeStyle='#d68a4f';c.lineWidth=5;c.lineCap='round';c.lineJoin='round';c.beginPath();
    path.forEach((q,i)=>{const [x,y]=ce(q);i?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();
    c.strokeStyle='#ffd7a3';c.lineWidth=1.2;c.stroke();
    const [hx,hy]=ce(path[path.length-1]);c.strokeStyle=col;c.lineWidth=1.5;c.strokeRect(hx-8,hy-8,16,16);
  }
  for(const [q,l] of [[m.a,'A'],[m.b,'B']]){const [x,y]=ce(q);rect(c,x-7,y-7,14,14,'#e8c35a');txt(c,l,x,y+.5,9,'#1b2332','center','"Silkscreen", monospace');}

// ---------- mission flow ----------
function join(p,m){p.mission=m;m.in[p.id]=true;setPose(p,'tablet',999);p.moving=false;p.ev=[];}
function startMission(p,o,it){
  p.item=null;o.user=p.id;
  const M=MIS[o.step];
  const m={step:o.step,item:it,st:o,owner:p.id,coop:!!M.coop&&!G.solo,phase:'intro',ready:[false,false],in:[false,false],mist:0,prog:0,need:1,t:0,done:false,doneT:0,shake:0,msg:'',msgT:0,stars:0,flash:0};
  M.init(m);join(p,m);
  if(m.coop){const q=players[1-p.id];if(!q.mission){join(q,m);sfx('call');}else G.pending.push(m);}
  sfx('put');
}
function finishMission(m){
  const it=m.item;it.stage=m.step;if(m.step===1)it.kind='wafer';if(m.step===8)it.kind='chip';
  const o=players[m.owner];o.item=it;m.st.user=null;G.stars+=m.stars;G.stepStars[m.step]=m.stars;
  for(const p of players)if(p.mission===m){p.mission=null;p.pose=null;}
}
function readyAll(m){return m.coop?(m.ready[0]&&m.ready[1]):m.ready[m.owner];}
function updateMissions(dt){
  G.pending=G.pending.filter(m=>{const q=players[1-m.owner];if(!q)return false;if(!q.mission){join(q,m);sfx('call');return false;}return true;});
  const ms=new Set(players.map(p=>p.mission).filter(Boolean));
  for(const p of players){
    const m=p.mission;if(!m)continue;const ev=p.ev;p.ev=[];
    for(const k of ev){
      if(m.phase==='intro'){if(k==='act'&&!m.ready[p.id]){m.ready[p.id]=true;sfx('ready');}}
      else if(!m.done&&MIS[m.step].press)MIS[m.step].press(m,k,p.id);
    }
  }
  for(const m of ms){
    const M=MIS[m.step];
    if(m.phase==='intro'){if(readyAll(m)){m.phase='play';m.t=0;}continue;}
    m.t+=dt;
    if(!m.done&&M.update)M.update(m,dt);
    if(m.shake>0)m.shake-=dt;if(m.msgT>0)m.msgT-=dt;
    if(m.done){m.doneT+=dt;if(m.doneT>1.8)finishMission(m);}
  }
}

// ---------- cross-section ----------
function mkItem(stage){return {kind:stage===0?'ingot':stage>=8?'chip':'wafer',stage,defect:false};}
function sectionAt(c,x,y,w,h,it){
  rect(c,x,y,w,h,'#0e131d');
  if(it.kind==='ingot'){rect(c,x+w*.32,y+h*.18,w*.36,h*.64,'#aab4c0');rect(c,x+w*.32,y+h*.18,w*.08,h*.64,'#d6dde6');return;}
  if(it.kind==='chip'){rect(c,x+w*.24,y+h*.25,w*.52,h*.42,'#262b36');for(let i=0;i<6;i++)rect(c,x+w*.27+i*w*.08,y+h*.67,w*.035,h*.12,'#e8c35a');return;}
  const st=it.stage,u=w/20,top=y+h*.52,oh=h*.12,L=x+u,R=x+w-u,gaps=[5,10,15];
  rect(c,L,top,R-L,h*.36,'#8f9aaa');
  const seg=(col,yy,hh)=>{c.fillStyle=col;let x0=L;for(const g of gaps){c.fillRect(x0,yy,x+(g-1)*u-x0,hh);x0=x+(g+1)*u;}c.fillRect(x0,yy,R-x0,hh);};
  if(st>=2){if(st>=4)seg('#7f84df',top-oh,oh);else rect(c,L,top-oh,R-L,oh,'#7f84df');}
  if(st===3)seg('#efb04a',top-2*oh,oh);
  if(st>=5){c.fillStyle='#d77fbf';for(const g of gaps)c.fillRect(x+(g-1.6)*u,top,3.2*u,h*.13);}
  if(st>=6){c.fillStyle='#d68a4f';for(const g of gaps)c.fillRect(x+(g-1)*u,top-oh,2*u,oh);c.fillRect(x+(gaps[0]-1)*u,top-2*oh,(gaps[2]-gaps[0]+2)*u,oh*.8);}
  if(st>=7){c.fillStyle='#3fc1a5';c.beginPath();c.arc(R-u,y+h*.2,h*.1,0,Math.PI*2);c.fill();}
}

// ---------- mission panel ----------
function panelXY(pid,m){const side=G.solo?roomOf(m.step):pid;return {x:side?176:8,y:15};}
function drawMission(c,p,time){
  const m=p.mission,P=PROC[m.step],M=MIS[m.step],R=panelXY(p.id,m),W=200,H=238;
  const other=1-p.id,on=(pid)=>pid?'2P':'1P';
  c.save();c.translate(R.x+(m.shake>0&&m.phase==='play'?Math.sin(time*80)*1.5:0),R.y);c.scale(K,K);
  rect(c,4,5,W,H,'rgba(0,0,0,.35)');rect(c,0,0,W,H,'#141b28');

  txt(c,String(m.step),16,19.5,9,'#141b28','center','"Silkscreen", monospace');
  txt(c,P.name,30,16,13,'#f1f4f8','left');
  txt(c,p.id===m.owner?'왜? '+P.why:on(m.owner)+'를 도와주세요!',30,29,8,p.id===m.owner?'#93a1b8':'#f2c14e','left');
  if(m.coop){rect(c,W-58,9,50,15,'#f2c14e');txt(c,'함께 미션',W-33,17,9,'#1a1405');}
  if(m.phase==='intro'){
    txt(c,'반도체 공정에서의 역할',10,46,9,'#3fc1a5','left');
    const n=wrap(c,P.role,10,61,W-20,13,10,'#e9eef5');

// ---------- update ----------
function update(dt){
  G.elapsed+=dt;
  if(G.mode==='challenge'){G.time-=dt;if(G.time<=0){G.time=0;endGame();return;}}
  updateMissions(dt);
  for(const p of players){
    if(!p.mission){
      const ev=p.ev;p.ev=[];
      for(const k of ev)if(k==='act')interact(p);
      let dx=(isDown(p,'right')?1:0)-(isDown(p,'left')?1:0),dy=(isDown(p,'down')?1:0)-(isDown(p,'up')?1:0);
      p.moving=!!(dx||dy)&&!p.mission;
      if(p.moving){
        p.dir=dx?(dx<0?'left':'right'):(dy<0?'up':'down');
        const len=Math.hypot(dx,dy),sp=62*dt;move(p,dx/len*sp,0);move(p,0,dy/len*sp);
        p.anim+=dt*8;if(p.pose&&p.pose!=='cheer')p.pose=null;
      }
      if(p.pose){p.poseT-=dt;if(p.poseT<=0)p.pose=null;}
    }else p.moving=false;
    p.blinkT-=dt;if(p.blinkT<=0){p.blink=.13;p.blinkT=2+Math.random()*3;}
    if(p.blink>0)p.blink-=dt;
  }
  for(const o of G.objs)if(o.flash>0)o.flash-=dt;
  G.msgs=G.msgs.filter(m=>(m.t+=dt)<1.6);
}
function blocked(x,y){
  const l=x-6,r=x+6,t=y-5,b=y-.01;
  for(const [px,py] of [[l,t],[r,t],[l,b],[r,b]]){const tx=Math.floor(px/T),ty=Math.floor(py/T);if(tx<0||ty<0||tx>=COLS||ty>=ROWS||solid[ty][tx])return true;}
  return false;
}
function move(p,dx,dy){const nx=p.x+dx,ny=p.y+dy;if(!blocked(nx,ny)){p.x=nx;p.y=ny;}}

  $('eKick').textContent=G.mode==='practice'?'PRACTICE CLEAR':'CHALLENGE REPORT';

function syncSetup(){
  $('n1').classList.toggle('on',solo);$('n2').classList.toggle('on',!solo);
  $('ctrl').classList.toggle('pick',solo);
  $('cc0').classList.toggle('sel',!solo||soloChar==='male');$('cc1').classList.toggle('sel',!solo||soloChar==='female');
  if(solo){$('ccT0').textContent='남자 쌤';$('ccT1').textContent='여자 쌤';
    const d='<kbd>WASD</kbd>·<kbd>방향키</kbd> 이동 · <kbd>E</kbd>·<kbd>Space</kbd> 작업';$('ccD0').innerHTML=soloChar==='male'?d:'눌러서 선택';$('ccD1').innerHTML=soloChar==='female'?d:'눌러서 선택';
    $('lead').innerHTML='혼자서 A동과 B동을 오가며 <b>8단계 공정 미션</b>을 풀어 반도체 칩을 완성해요. 가운데 문으로 두 방을 오갈 수 있어요.';}
  else{$('ccT0').textContent='1P · 왼쪽 방';$('ccT1').textContent='2P · 오른쪽 방';
    $('ccD0').innerHTML='<kbd>WASD</kbd> 이동 · <kbd>E</kbd> 또는 <kbd>L-Shift</kbd> 작업';$('ccD1').innerHTML='<kbd>방향키</kbd> 이동 · <kbd>Space</kbd> 작업';
    $('lead').innerHTML='두 연구원이 웨이퍼를 주고받으며 <b>8단계 공정 미션</b>을 풀어 반도체 칩을 완성해요. 둘이 힘을 합쳐야 하는 <b>함께 미션</b>도 있어요.';}
  try{localStorage.setItem('cleanroomDuoSetup',JSON.stringify({solo,c:soloChar}));}catch(e){}
  if(!G)renderIdle();
}
$('n1').onclick=()=>{solo=true;syncSetup();};$('n2').onclick=()=>{solo=false;syncSetup();};
$('cc0').onclick=()=>{if(solo){soloChar='male';syncSetup();}};$('cc1').onclick=()=>{if(solo){soloChar='female';syncSetup();}};
$('btnPractice').onclick=()=>startGame('practice');
$('btnChallenge').onclick=()=>startGame('challenge');
$('eAgain').onclick=()=>startGame('challenge');
$('eMenu').onclick=toMenu;
function renderIdle(){
  G={mode:'practice',solo,objs:makeObjs(),msgs:[],pending:[]};buildSolid();renderBG();
  ctx.setTransform(1,0,0,1,0,0);ctx.drawImage(bg,0,0);ctx.setTransform(S,0,0,S,0,0);for(const o of G.objs)drawObj(ctx,o,0);G=null;
}
let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  if(G&&!G.paused&&!G.over)update(dt);
  if(G){draw(ts/1000);updateHUD();}
  requestAnimationFrame(loop);
}
function onReady(){
  for(const i of [0,1]){const c=$('pv'+i).getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(i?imgs.female:imgs.male,POSE.wave*FW,4*FH,FW,FH,0,0,FW,FH);}
  fit();
  const go=()=>{syncSetup();requestAnimationFrame(loop);};
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(go);else go();
}
})();
</script>
