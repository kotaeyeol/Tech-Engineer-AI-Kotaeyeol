<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>에너지 섬</title>
<meta name="description" content="A섬과 B섬의 발전소 12종을 눌러 에너지 전환 흐름을 단계별 애니메이션으로 살펴보는 고등학교 기술 수업 자료">
<meta property="og:title" content="에너지 섬">
<meta property="og:description" content="발전소를 눌러 전기가 만들어지는 과정을 따라가 보세요. 경기도 기술교사 고태열 · 공학하는 기술쌤">
<meta property="og:image" content="https://kotaeyeol.github.io/Tech-Engineer-AI-Kotaeyeol/images/energy.png">
<meta name="theme-color" content="#93cde6">
<link rel="icon" href="../favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed 3D island under a sky gradient; HUD floats over it; the plant panel docks right on wide screens and rises as a bottom sheet on narrow or portrait tablets. Single bright daytime look by design. */
:root{
  --ink:#14324a;
  --ink-soft:#4f6c7d;
  --paper:#f8fbfc;
  --mist:#e8f1f4;
  --line:#cfdde4;
  --sky-top:#93cde6;
  --sky-low:#e4f4f3;
  --elec:#f2b705;
  --accent:#2d77c9;
  --display:"Do Hyeon","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  margin:0;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  background:linear-gradient(180deg,var(--sky-top) 0%,#c3e5f0 48%,var(--sky-low) 100%);
  color:var(--ink);font-family:var(--body);
  word-break:keep-all;overflow-wrap:break-word;line-break:strict;
  -webkit-tap-highlight-color:transparent;
}
#app{position:fixed;inset:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}

/* brand */
.brand{
  position:absolute;
  top:calc(env(safe-area-inset-top,0px) + 18px);
  left:max(18px, env(safe-area-inset-left,0px));
  max-width:min(420px, calc(100% - 36px));
  pointer-events:none;
  transition:opacity .4s ease, transform .5s cubic-bezier(.2,.8,.2,1);
}
.eyebrow{margin:0 0 6px;font:500 12px/1.3 var(--body);letter-spacing:.08em;color:var(--ink-soft)}
.brand h1{margin:0;font:400 clamp(40px,6vw,64px)/.95 var(--display);letter-spacing:-.01em;color:var(--ink);text-wrap:balance}
.brand h1 span{color:var(--elec);-webkit-text-stroke:0}
.lead{margin:12px 0 0;font:500 15px/1.6 var(--body);color:var(--ink);max-width:34ch}
.lead span{display:block;margin-top:6px;font-size:13.5px;color:var(--ink-soft)}
.is-open .brand{opacity:0;transform:translateY(-10px)}

/* dock */
.dock{
  position:absolute;left:0;right:0;margin-inline:auto;width:max-content;
  bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  display:flex;gap:6px;padding:6px;
  background:rgba(248,251,252,.88);
  border:1px solid rgba(20,50,74,.08);
  border-radius:999px;
  box-shadow:0 10px 30px -12px rgba(20,50,74,.35);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  max-width:calc(100% - 32px);overflow-x:auto;scrollbar-width:none;
  transition:opacity .35s ease, transform .5s cubic-bezier(.2,.8,.2,1);
}
.dock::-webkit-scrollbar{display:none}
.dock button{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  border:0;background:transparent;color:var(--ink);
  font:500 15px/1 var(--body);padding:11px 14px;border-radius:999px;cursor:pointer;
  transition:background .2s;
}
.dock button:hover,.dock button:focus-visible{background:var(--mist)}
.dock button:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}
.tag{font:500 10.5px/1 var(--body);letter-spacing:.04em;color:#2c7a4f;background:#dff3e6;padding:4px 6px;border-radius:6px}
.is-open .dock{opacity:0;pointer-events:none;transform:translateY(20px)}


/* island switcher */
.isl{
  position:absolute;top:calc(env(safe-area-inset-top,0px) + 18px);right:max(18px, env(safe-area-inset-right,0px));
  display:flex;gap:4px;padding:5px;border-radius:16px;
  background:rgba(248,251,252,.9);border:1px solid rgba(20,50,74,.08);box-shadow:0 10px 30px -12px rgba(20,50,74,.35);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:opacity .35s ease, transform .5s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 36px);
}
.isl button{border:0;background:transparent;border-radius:12px;padding:10px 22px;cursor:pointer;text-align:left;color:var(--ink-soft);display:flex;flex-direction:column;gap:4px;min-width:0}
.isl button b{font:400 19px/1.05 var(--display);color:inherit;white-space:nowrap}
.isl button small{font:500 11.5px/1.2 var(--body);color:inherit;opacity:.85;white-space:nowrap}
.isl button.on{background:var(--ink);color:#fff}
.isl button:not(.on):hover{background:var(--mist)}
.isl button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.is-open .isl{opacity:0;pointer-events:none;transform:translateY(-10px)}
.tag.new{color:#5a3aa0;background:#ece4fa}
.kind.new{background:#ece4fa;color:#5a3aa0}
@media (max-width:900px){
  .isl{top:auto;left:0;right:0;margin-inline:auto;width:max-content;bottom:calc(env(safe-area-inset-bottom,0px) + 82px)}
  .is-open .isl{transform:translateY(10px)}
  .isl button{padding:8px 11px}
  .isl button b{font-size:16px}
  .isl button small{font-size:11px}
}

.credit{position:absolute;left:max(18px, env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);margin:0;
  font:500 12.5px/1.45 var(--body);color:var(--ink);opacity:.8;pointer-events:none;display:flex;flex-direction:column}
.credit span{font:400 15px/1.2 var(--display);opacity:.9}
@media (max-width:1180px){.credit{bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}}
@media (max-width:900px){.credit{bottom:calc(env(safe-area-inset-bottom,0px) + 146px)}}
.snd{position:absolute;left:max(18px, env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 70px);
  display:flex;align-items:center;gap:7px;height:40px;padding:0 14px 0 11px;border-radius:999px;border:1px solid rgba(20,50,74,.1);
  background:rgba(248,251,252,.9);color:var(--ink);font:500 13px/1 var(--body);cursor:pointer;
  box-shadow:0 8px 22px -12px rgba(20,50,74,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.snd:hover{background:var(--paper)}
.snd:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.snd .off{display:none}
.snd[aria-pressed="false"] .on{display:none}
.snd[aria-pressed="false"] .off{display:block}
.snd[aria-pressed="false"]{color:var(--ink-soft)}
@media (max-width:1180px){.snd{bottom:calc(env(safe-area-inset-bottom,0px) + 136px)}}
@media (max-width:900px){.snd{bottom:calc(env(safe-area-inset-bottom,0px) + 198px)}}

/* pins */
#pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pin{
  position:absolute;left:0;top:0;pointer-events:auto;
  display:flex;flex-direction:column;align-items:center;gap:0;
  border:0;background:none;padding:0;cursor:pointer;
  transition:opacity .3s ease;
  will-change:transform;
}
.pin .lbl{
  display:flex;align-items:center;gap:7px;
  font:400 17px/1 var(--display);letter-spacing:.01em;color:var(--ink);
  background:var(--paper);padding:8px 12px 8px 9px;border-radius:12px;
  box-shadow:0 6px 18px -8px rgba(20,50,74,.45);
  border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);
  transition:transform .2s ease;
}
.pin .stem{width:2px;height:16px;background:linear-gradient(var(--c),transparent)}
.pin:hover .lbl,.pin:focus-visible .lbl{transform:translateY(-3px)}
.pin:focus-visible{outline:none}
.pin:focus-visible .lbl{outline:2px solid var(--ink);outline-offset:2px}
.pin.off{opacity:0;pointer-events:none}
.is-open .pin{opacity:0;pointer-events:none}

/* panel */
#panel{
  position:absolute;
  top:calc(env(safe-area-inset-top,0px) + 14px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  right:max(14px, env(safe-area-inset-right,0px));
  width:min(50vw, 860px);
  background:var(--paper);
  border-radius:24px;
  box-shadow:0 30px 60px -24px rgba(20,50,74,.45),0 0 0 1px rgba(20,50,74,.06);
  display:flex;flex-direction:column;
  overflow:hidden;
  transform:translateX(calc(100% + 40px));
  visibility:hidden;
  transition:transform .6s cubic-bezier(.2,.8,.2,1), visibility 0s linear .6s;
}
.is-open #panel{transform:none;visibility:visible;transition:transform .6s cubic-bezier(.2,.8,.2,1), visibility 0s}
.p-scroll{overflow:hidden;padding:18px 20px 18px;display:flex;flex-direction:column;gap:12px;min-height:0;flex:1}
.p-scroll > *{flex-shrink:0}
.p-head{display:flex;align-items:flex-start;gap:12px}
.p-head > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.p-head h2{margin:0;font:400 30px/1 var(--display);color:var(--ink);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.p-head h2 i{width:13px;height:13px;border-radius:4px;background:var(--accent);display:inline-block}
.kind{display:inline-flex;align-items:center;font:500 12px/1 var(--body);letter-spacing:.04em;padding:6px 8px;border-radius:7px;background:#eef1f3;color:#5a6670}
.kind.renew{background:#dff3e6;color:#2c7a4f}
.close{
  flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;
  background:var(--mist);color:var(--ink);display:grid;place-items:center;
}
.close:hover{background:#dce8ee}
.close:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.chain{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.chain li{display:flex;align-items:center;gap:5px}
.chain .chip{
  font:500 13px/1 var(--body);padding:6px 9px;border-radius:7px;
  background:var(--mist);color:var(--ink-soft);
  transition:background .35s, color .35s;
}
.chain .chip.on{background:var(--accent);color:#fff}
.chain .arr{color:#9db3bf;font:500 13px/1 var(--mono)}

/* the figure takes whatever height is left; the canvas keeps 16:10 inside it */
.p-scroll > .fig{flex:1 1 0;min-height:0}
.fig{position:relative;border-radius:16px;overflow:hidden;background:#eef5f7;border:1px solid var(--line);width:100%}
.fig canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block}

.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:var(--mist);padding:4px;border-radius:12px}
.steps button{
  border:0;background:transparent;border-radius:9px;cursor:pointer;
  padding:8px 2px;font:500 13px/1.2 var(--body);color:var(--ink-soft);
  display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;
  transition:background .25s,color .25s;
}
.steps button b{font:500 12px/1 var(--mono);color:inherit;opacity:.8}
.steps button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-size:12px}
.steps button.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 8px -3px rgba(20,50,74,.3)}
.steps button.on b{color:var(--accent);opacity:1}
.steps button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.prog{height:3px;border-radius:2px;background:var(--mist);overflow:hidden;margin-top:-8px}
.prog i{display:block;height:100%;width:0;background:var(--accent);border-radius:2px}

.card{display:flex;flex-direction:column;gap:7px;min-height:132px}
.card .top{display:flex;align-items:baseline;gap:10px}
.card .no{margin:0;font:500 12px/1 var(--mono);color:var(--accent);letter-spacing:.06em;white-space:nowrap}
.card h3{margin:0;font:400 25px/1.05 var(--display);color:var(--ink)}
.card p.desc{margin:0;font:400 15px/1.5 var(--body);color:var(--ink);text-wrap:pretty}
.kw{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.kw li{font:500 13.5px/1 var(--body);padding:7px 11px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--accent) 40%,transparent);color:var(--ink);background:color-mix(in srgb,var(--accent) 7%,var(--paper))}
.kw li::before{content:"#";color:var(--accent);margin-right:2px}
.card.swap{animation:swap .45s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:3px 12px}
.facts dt{font:500 12.5px/1.5 var(--body);color:var(--accent)}
.facts dd{margin:0;font:400 13.5px/1.5 var(--body);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

.ctrl{display:flex;gap:8px}
.ctrl button{
  flex:1;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);
  color:var(--ink);font:500 14px/1 var(--body);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;
}
.ctrl button.play{flex:1.3;background:var(--ink);border-color:var(--ink);color:#fff}
.ctrl button:hover{border-color:#9fb6c2}
.ctrl button.play:hover{background:#1d4363}
.ctrl button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (max-width:820px), (orientation:portrait) and (max-width:1100px){
  #panel{
    top:auto;left:0;right:0;bottom:0;width:auto;
    height:min(68%, 760px);
    border-radius:24px 24px 0 0;
    transform:translateY(calc(100% + 30px));
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .p-scroll{padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px));padding-top:12px}
  .sheet-grip{display:block}
}
.sheet-grip{display:none;width:44px;height:5px;border-radius:3px;background:#cbd9e0;margin:10px auto -4px}
@media (max-width:520px){
  .brand h1{font-size:40px}
  .lead{font-size:14px}
  .dock button{padding:10px 11px;font-size:14px}
  .dock .tag{display:none}
  .p-head h2{font-size:26px}
  .facts dd{white-space:normal}
}
@media (max-height:760px){
  .p-scroll{gap:9px;padding-top:14px;padding-bottom:14px}
  .p-head h2{font-size:25px}
  .chain .chip{padding:5px 8px;font-size:12px}
  .steps button{padding:6px 2px}
  .card{min-height:118px;gap:5px}
  .card h3{font-size:22px}
  .card p.desc{font-size:14px;line-height:1.45}
  .kw li{padding:6px 10px;font-size:12.5px}
  .ctrl button{height:40px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01s!important;animation:none!important}
}
.loading{position:absolute;inset:0;display:grid;place-items:center;font:400 22px var(--display);color:var(--ink);pointer-events:none;transition:opacity .6s}
.loading.done{opacity:0}
</style>
</head>
<body>
<div id="app">
  <canvas id="gl" aria-label="3D 에너지 섬. 드래그해서 돌려보고, 발전소를 눌러 자세히 보세요."></canvas>
  <div class="loading" id="loading">섬을 만드는 중…</div>
  <div id="pins"></div>

  <header class="brand">
    <p class="eyebrow">고등학교 기술 · 에너지와 수송 기술</p>
    <h1>에너지 섬</h1>
    <p class="lead">A섬과 B섬을 번갈아 둘러보며<br>다양한 에너지의 발전 과정을 알아보세요.<br><span>발전소를 누르면 전기가 만들어지는 흐름이 펼쳐져요.</span></p>
  </header>

  <div class="isl" id="isl" role="tablist" aria-label="섬 선택">
    <button role="tab" data-i="1"><b>A섬</b></button>
    <button role="tab" data-i="2"><b>B섬</b></button>
  </div>

  <nav class="dock" id="dock" aria-label="발전소 바로가기"></nav>

  <button class="snd" id="snd" aria-pressed="true" aria-label="소리 끄기">
    <svg class="on" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8v4h3l4 3.5v-11L6 8z" fill="currentColor"/><path d="M13 7.2a4 4 0 0 1 0 5.6M15.4 5a7 7 0 0 1 0 10"/></svg>
    <svg class="off" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8v4h3l4 3.5v-11L6 8z" fill="currentColor"/><path d="M13.5 7.5l5 5M18.5 7.5l-5 5"/></svg>
    <span>소리</span>
  </button>
  <p class="credit">경기도 기술교사 고태열<span>공학하는 기술쌤</span></p>

  <aside id="panel" aria-live="polite" aria-label="발전소 설명">
    <div class="sheet-grip"></div>
    <div class="p-scroll">
      <div class="p-head">
        <div>
          <h2><i></i><span id="pName"></span><span class="kind" id="pKind"></span></h2>
          <ol class="chain" id="pChain" aria-label="에너지 전환"></ol>
        </div>
        <button class="close" id="pClose" aria-label="섬 전체 보기로 돌아가기">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 4l10 10M14 4L4 14"/></svg>
        </button>
      </div>

      <div class="fig" id="fig"><canvas id="proc"></canvas></div>

      <div class="steps" id="pSteps" role="tablist" aria-label="발전 단계"></div>
      <div class="prog"><i id="pProg"></i></div>

      <div class="card" id="pCard">
        <div class="top"><p class="no" id="pNo"></p><h3 id="pTitle"></h3></div>
        <p class="desc" id="pDesc"></p>
        <ul class="kw" id="pKw"></ul>
        <dl class="facts" id="pFacts" hidden>
          <dt>장점</dt><dd id="pPro"></dd>
          <dt>한계</dt><dd id="pCon"></dd>
          <dt>사례</dt><dd id="pEx"></dd>
        </dl>
      </div>

      <div class="ctrl">
        <button id="bPrev" aria-label="이전 단계">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M10.5 3.5L5 8l5.5 4.5z"/></svg>이전
        </button>
        <button id="bPlay" class="play"></button>
        <button id="bNext" aria-label="다음 단계">다음
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M5.5 3.5L11 8l-5.5 4.5z"/></svg>
        </button>
      </div>
    </div>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';

/* ---------------------------------------------------------------
   DATA
--------------------------------------------------------------- */
const PLANTS = [
  { id:'thermal', name:'화력 발전', short:'화력', color:'#d4532c', renew:false,
    chain:['화학','열','운동','전기'],
    flow:'연료 → 보일러 → 터빈 → 발전기',
    steps:[

function mkP(pts){const L=[0];for(let i=1;i<pts.length;i++)L.push(L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));return{pts,L,total:L[L.length-1]};}
function ptAt(p,d){d=((d%p.total)+p.total)%p.total;let i=1;while(i<p.L.length-1&&p.L[i]<d)i++;const a=p.pts[i-1],b=p.pts[i],seg=p.L[i]-p.L[i-1],u=seg?(d-p.L[i-1])/seg:0;return[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];}
function line(c,pts){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.stroke();}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();}
function box(c,x,y,w,h,r,fill,stroke){rr(c,x,y,w,h,r);c.fillStyle=fill;c.fill();c.lineWidth=2;c.strokeStyle=stroke||C.ink;c.stroke();}
function pipe(c,p,o){
  const w=o.w||12;
  c.save();c.lineCap='round';c.lineJoin='round';
  c.strokeStyle=C.pipe;c.lineWidth=w;line(c,p.pts);
  c.strokeStyle=o.on?o.color:C.idle;c.lineWidth=w-5;line(c,p.pts);
  if(o.on){
    const gap=o.gap||22,n=Math.ceil(p.total/gap),off=(T*(o.speed||70))%gap;
    c.fillStyle=o.dot||'rgba(255,255,255,.95)';
    for(let i=0;i<=n;i++){
      let d=o.rev?(p.total-(i*gap+off)):(i*gap+off);
      if(d<0||d>p.total)continue;
      const q=ptAt(p,Math.min(d,p.total-0.001));
      c.beginPath();c.arc(q[0],q[1],o.r||2.4,0,7);c.fill();
    }
  }
  c.restore();
}
function wire(c,p,on){pipe(c,p,{w:7,color:C.elec,on,speed:150,gap:20,r:2,dot:'#fff8d6'});}
function lab(c,x,y,t,o){o=o||{};c.font=`${o.w||700} ${(o.size||12.5)*1.18}px ${FONT}`;c.textAlign=o.align||'center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=4.5;c.strokeStyle=(o.c==='#fff')?'rgba(20,50,74,.35)':'rgba(248,251,252,.95)';c.strokeText(t,x,y);c.fillStyle=o.c||C.ink;c.fillText(t,x,y);}
function pylon(c,x,y,h){
  c.save();c.strokeStyle=C.ink;c.lineWidth=1.5;c.beginPath();
  c.moveTo(x-12,y+h);c.lineTo(x-3,y);c.lineTo(x+3,y);c.lineTo(x+12,y+h);
  for(let i=0;i<4;i++){const y1=y+h*i/4,y2=y+h*(i+1)/4,w1=3+9*i/4,w2=3+9*(i+1)/4;c.moveTo(x-w1,y1);c.lineTo(x+w2,y2);c.moveTo(x+w1,y1);c.lineTo(x-w2,y2);}
  c.moveTo(x-15,y+10);c.lineTo(x+15,y+10);c.moveTo(x-11,y+22);c.lineTo(x+11,y+22);c.stroke();c.restore();
  lab(c,x,y+h+12,'송전',{size:11.5,c:C.soft});
}
function turbine(c,x,y,r,ang,lit){
  c.save();c.translate(x,y);
  c.beginPath();c.arc(0,0,r+7,0,7);c.fillStyle=C.metal;c.fill();c.lineWidth=2;c.strokeStyle=C.ink;c.stroke();
  c.rotate(ang);
  for(let i=0;i<9;i++){c.save();c.rotate(i*Math.PI*2/9);c.beginPath();c.moveTo(0,-2.5);c.quadraticCurveTo(r*.55,-9,r,-3);c.lineTo(r,3);c.quadraticCurveTo(r*.5,2,0,2.5);c.closePath();c.fillStyle=lit?'#3f6f8c':'#a9bbc6';c.fill();c.restore();}
  c.beginPath();c.arc(0,0,Math.max(4,r*.22),0,7);c.fillStyle=C.ink;c.fill();
  c.restore();
}
function generator(c,x,y,ang,lit,sc){
  sc=sc||1;c.save();c.translate(x,y);c.scale(sc,sc);
  if(lit){const g=c.createRadialGradient(0,0,8,0,0,86);const a=.38+.12*Math.sin(T*6);g.addColorStop(0,`rgba(242,183,5,${a})`);g.addColorStop(1,'rgba(242,183,5,0)');c.fillStyle=g;c.fillRect(-90,-90,180,180);}
  box(c,-46,-33,92,66,10,C.metal);
  c.strokeStyle='#c4783a';c.lineWidth=3;
  for(let i=0;i<5;i++){const yy=-20+i*10;c.beginPath();c.moveTo(-39,yy);c.lineTo(-29,yy);c.moveTo(29,yy);c.lineTo(39,yy);c.stroke();}
  c.strokeStyle=C.ink;c.lineWidth=1.5;c.beginPath();c.arc(0,0,25,0,7);c.stroke();
  c.rotate(ang);c.fillStyle='#d9534f';c.fillRect(-21,-8,21,16);c.fillStyle='#3b6fc4';c.fillRect(0,-8,21,16);
  c.fillStyle='#fff';c.font=`700 10px ${FONT}`;c.textAlign='center';c.textBaseline='middle';c.fillText('N',-11,0);c.fillText('S',11,0);
  c.restore();
  if(lit&&Math.sin(T*27)>-.2){
    c.save();c.strokeStyle=C.elec;c.lineWidth=2.4;c.lineJoin='round';
    const bx=x+40*sc,by=y-38*sc,j=Math.sin(T*41)*3;

}
function flame(c,x,y,w,h){
  const g=c.createLinearGradient(0,y,0,y-h);g.addColorStop(0,C.heat);g.addColorStop(1,C.fire);
  c.beginPath();c.moveTo(x-w/2,y);c.quadraticCurveTo(x-w/2,y-h*.55,x,y-h);c.quadraticCurveTo(x+w/2,y-h*.55,x+w/2,y);c.closePath();c.fillStyle=g;c.fill();
  c.beginPath();c.moveTo(x-w/4,y);c.quadraticCurveTo(x-w/4,y-h*.35,x,y-h*.55);c.quadraticCurveTo(x+w/4,y-h*.35,x+w/4,y);c.closePath();c.fillStyle='#fff2b0';c.fill();

function gear(c,x,y,r,n,ang,fill){
  c.save();c.translate(x,y);c.rotate(ang);c.beginPath();
  for(let i=0;i<n*2;i++){const a0=i*Math.PI/n,a1=(i+1)*Math.PI/n,rr2=i%2?r-2:r+4;c.lineTo(Math.cos(a0)*rr2,Math.sin(a0)*rr2);c.lineTo(Math.cos(a1)*rr2,Math.sin(a1)*rr2);}
  c.closePath();c.fillStyle=fill;c.fill();c.lineWidth=1.6;c.strokeStyle=C.ink;c.stroke();
  c.beginPath();c.arc(0,0,r*.28,0,7);c.fillStyle=C.paper;c.fill();c.stroke();
  c.beginPath();c.moveTo(-r*.6,0);c.lineTo(r*.6,0);c.stroke();
  c.restore();
}
function arrowV(c,x,y1,y2,col,label){
  c.save();c.strokeStyle=col;c.fillStyle=col;c.lineWidth=2;
  line(c,[[x,y1+8],[x,y2-8]]);
  c.beginPath();c.moveTo(x,y1);c.lineTo(x-5,y1+9);c.lineTo(x+5,y1+9);c.fill();
  c.beginPath();c.moveTo(x,y2);c.lineTo(x-5,y2-9);c.lineTo(x+5,y2-9);c.fill();
  c.restore();
  if(label)lab(c,x+8,(y1+y2)/2,label,{align:'left',c:col});
}
function waterBody(c,xs,xe,y,bottom,col,amp,ph){
  c.beginPath();c.moveTo(xs,bottom);
  for(let x=xs;x<=xe;x+=8)c.lineTo(x,y+Math.sin(x*.05+T*2+(ph||0))*(amp||2.5));
  c.lineTo(xe,y);c.lineTo(xe,bottom);c.closePath();
  const g=c.createLinearGradient(0,y,0,bottom);g.addColorStop(0,col);g.addColorStop(1,'#1f5c9e');c.fillStyle=g;c.fill();
}

const SP={};
function spin(key,on,speed){const s=SP[key]||(SP[key]={a:0,v:0});s.v+=((on?speed:0)-s.v)*Math.min(1,DT*1.6);s.a+=s.v*DT;return s.a;}
const LV={};
function ease(key,target,rate){if(LV[key]===undefined)LV[key]=target;LV[key]+=(target-LV[key])*Math.min(1,DT*(rate||3));return LV[key];}

const proc=document.getElementById('proc'), pctx=proc.getContext('2d'), fig=document.getElementById('fig');
let procScale=1;
function sizeProc(){const r=fig.getBoundingClientRect();if(!r.width||!r.height)return;
  let w=r.width-2,h=w*H2/W2;if(h>r.height-2){h=r.height-2;w=h*W2/H2;}
  const dpr=Math.min(window.devicePixelRatio||1,2);
  proc.style.width=w+'px';proc.style.height=h+'px';proc.width=Math.round(w*dpr);proc.height=Math.round(h*dpr);procScale=proc.width/W2;}
new ResizeObserver(sizeProc).observe(fig);

const FR={x:0,y:0,w:W2,h:H2,a:0};
const CAM={x:0,y:0,w:W2};
function drawProc(){
  const sel=state.sel;if(!sel)return;
  const [fn,focus]=DRAW[sel.id];
  const c=pctx;c.setTransform(1,0,0,1,0,0);
  c.fillStyle='#eef5f7';c.fillRect(0,0,proc.width,proc.height);
  // gentle zoom toward the current step (full view on ALL)
  const tgt=state.step<5?focus[state.step]:[0,0,W2,H2];
  let vw=W2,vx=0,vy=0;
  if(state.step<5){
    const pad=60,z=Math.max(1,Math.min(1.45,W2/(tgt[2]+pad*2),H2/(tgt[3]+pad*2)));
    vw=W2/z;const vh=H2/z;
    vx=Math.min(W2-vw,Math.max(0,tgt[0]+tgt[2]/2-vw/2));vy=Math.min(H2-vh,Math.max(0,tgt[1]+tgt[3]/2-vh/2));
  }
  const kc=Math.min(1,DT*2.6);
  CAM.w+=(vw-CAM.w)*kc;CAM.x+=(vx-CAM.x)*kc;CAM.y+=(vy-CAM.y)*kc;
  const s=procScale*W2/CAM.w;
  c.setTransform(s,0,0,s,-CAM.x*s,-CAM.y*s);
  c.strokeStyle='#e1ecf0';c.lineWidth=1;c.beginPath();for(let x=20;x<W2;x+=20){c.moveTo(x,0);c.lineTo(x,H2);}for(let y=20;y<H2;y+=20){c.moveTo(0,y);c.lineTo(W2,y);}c.stroke();
  fn(c,state.step);
  // spotlight
  const k=Math.min(1,DT*5);
  FR.x+=(tgt[0]-FR.x)*k;FR.y+=(tgt[1]-FR.y)*k;FR.w+=(tgt[2]-FR.w)*k;FR.h+=(tgt[3]-FR.h)*k;
  FR.a+=((state.step<5?1:0)-FR.a)*k;
  if(FR.a>.01){
    c.save();
    c.beginPath();c.rect(0,0,W2,H2);
    const x=FR.x,y=FR.y,w=FR.w,h=FR.h,r=14;
    c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
    c.fillStyle=`rgba(238,245,247,${.66*FR.a})`;c.fill('evenodd');
    c.globalAlpha=FR.a;rr(c,x,y,w,h,r);c.setLineDash([7,6]);c.lineDashOffset=-T*24;c.strokeStyle=sel.color;c.lineWidth=2.2;c.stroke();
    c.restore();
  }
}

function mesh(g,m,x,y,z,parent){const o=new THREE.Mesh(g,m);o.position.set(x||0,y||0,z||0);o.castShadow=true;o.receiveShadow=true;if(parent)parent.add(o);return o;}

/* noise + terrain (two islands + a small islet) */
function hash(x,y){const s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s);}
function vnoise(x,y){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi),b=hash(xi+1,yi),c=hash(xi,yi+1),d=hash(xi+1,yi+1);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v;}
function fbm(x,y){return vnoise(x,y)*.55+vnoise(x*2.1,y*2.1)*.3+vnoise(x*4.3,y*4.3)*.15;}
const sstep=(e0,e1,x)=>{const t=Math.min(1,Math.max(0,(x-e0)/(e1-e0)));return t*t*(3-2*t);};
const shapeR=a=>72+7*Math.sin(3*a+.6)+5*Math.sin(5*a+2.1)+3*Math.sin(8*a);
const shapeR2=a=>62+6*Math.sin(2*a+.4)+5*Math.sin(5*a+1.3)+2.5*Math.sin(9*a);
const VOL={x:-34,z:30};
const I1={x:0,z:0},I2={x:230,z:-30};
const ISLET={x:I2.x+68.8,z:I2.z+58};
function baseH1(x,z){
  const d=Math.hypot(x,z),r=shapeR(Math.atan2(z,x));
  const m=sstep(r+4,r-14,d);
  let h=-7+m*(9+fbm(x*.035+3,z*.035+7)*6);
  const vd=Math.hypot(x-VOL.x,z-VOL.z);
  h+=26*Math.exp(-(vd*vd)/(2*13*13))*m;
  h-=6*Math.exp(-(vd*vd)/(2*3.2*3.2));
  return h;
}
function baseH2(x,z){
  const dx=x-I2.x,dz=z-I2.z,d=Math.hypot(dx,dz),r=shapeR2(Math.atan2(dz,dx));
  const m=sstep(r+4,r-14,d);
  let h=-7+m*(8.5+fbm(x*.04+11,z*.04+5)*5);
  const hd=Math.hypot(dx+8,dz+34);h+=7*Math.exp(-(hd*hd)/(2*13*13))*m;
  const di=Math.hypot(x-ISLET.x,z-ISLET.z),mi=sstep(17,6,di);
  h=Math.max(h,-7+mi*(11+fbm(x*.06,z*.06)*4));
  return h;
}
function baseH(x,z){return Math.max(baseH1(x,z),baseH2(x,z));}
function coastR(cx,cz,a){for(let r=25;r<110;r+=.5){if(baseH(cx+Math.cos(a)*r,cz+Math.sin(a)*r)<.6)return r;}return 60;}
const SITES={
  thermal:{x:34,z:32,r:12},
  nuclear:{x:56,z:-14,r:13},
  hydro:{x:-20,z:-38,r:17},
  geo:{x:-14,z:46,r:9},
  town:{x:2,z:4,r:16},
  wind1:{x:-50,z:-16,r:3},wind2:{x:-53,z:-2,r:3},wind3:{x:-49,z:12,r:3},
  pv:{x:I2.x-32,z:I2.z+20,r:14},
  st:{x:I2.x-30,z:I2.z-16,r:15},
  bio:{x:I2.x+22,z:I2.z-30,r:11},
  h2:{x:I2.x+30,z:I2.z+12,r:9},
  town2:{x:I2.x+2,z:I2.z-2,r:13}
};
(function(){
  const aw=-1.75,rw=coastR(I2.x,I2.z,aw)-1.5;SITES.wave={x:I2.x+Math.cos(aw)*rw,z:I2.z+Math.sin(aw)*rw,r:4,pad:false};
  const as=.7,rs=(coastR(I2.x,I2.z,as)+79)/2;SITES.stream={x:I2.x+Math.cos(as)*rs,z:I2.z+Math.sin(as)*rs,r:5,pad:false};
})();
for(const k in SITES){const s=SITES[k];s.h=s.pad===false?Math.max(.3,baseH(s.x,s.z)):Math.max(2.4,baseH(s.x,s.z));}
function heightAt(x,z){
  let h=baseH(x,z);
  for(const k in SITES){const s=SITES[k];if(s.pad===false)continue;const pd=Math.hypot(x-s.x,z-s.z);if(pd>s.r+7)continue;const w=sstep(s.r+7,s.r,pd);if(w>0)h=h+(s.h-h)*w;}
  return h;
}

function buildTerrain(cx,cz,sx,sz,seg){
  const g=new THREE.PlaneGeometry(sx,sz,seg,Math.round(seg*sz/sx));g.rotateX(-Math.PI/2);g.translate(cx,0,cz);
  const p=g.attributes.position,cols=[],col=new THREE.Color();
  const sand=new THREE.Color(0xe9dcad),grass=new THREE.Color(0x86b86a),grass2=new THREE.Color(0x6aa35a),rock=new THREE.Color(0x9a8c7c),ash=new THREE.Color(0x5f534b),bed=new THREE.Color(0xd2c7a2);
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),z=p.getZ(i),h=heightAt(x,z);p.setY(i,h);
    const vd=Math.hypot(x-VOL.x,z-VOL.z);
    if(h<0)col.copy(bed);
    else if(h<1.4)col.copy(sand);
    else if(h<2.4)col.copy(sand).lerp(grass,(h-1.4));
    else{col.copy(grass).lerp(grass2,fbm(x*.08,z*.08));
      if(vd<26&&h>10)col.lerp(rock,Math.min(1,(h-10)/8));
      if(vd<9&&h>22)col.lerp(ash,Math.min(1,(h-22)/6));}
    const n=(hash(Math.round(x*2),Math.round(z*2))-.5)*.05;
    cols.push(col.r+n,col.g+n,col.b+n);
  }
  g.setAttribute('color',new THREE.Float32BufferAttribute(cols,3));g.computeVertexNormals();
  const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:.95}));
  m.receiveShadow=true;scene.add(m);return m;
}

/* water */
const waterMat=new THREE.ShaderMaterial({
  transparent:true,depthWrite:false,
  uniforms:{uT:{value:0}},
  vertexShader:`varying vec3 vW;void main(){vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`,
  fragmentShader:`uniform float uT;varying vec3 vW;
  float shapeR(float a){return 72.+7.*sin(3.*a+.6)+5.*sin(5.*a+2.1)+3.*sin(8.*a);}
  float shapeR2(float a){return 62.+6.*sin(2.*a+.4)+5.*sin(5.*a+1.3)+2.5*sin(9.*a);}
  void main(){
    float d=length(vW.xz);float a=atan(vW.z,vW.x);float sr=shapeR(a);
    vec2 q=vW.xz-vec2(${I2.x.toFixed(1)},${I2.z.toFixed(1)});float d2=length(q);float a2=atan(q.y,q.x);float sr2=shapeR2(a2);
    float di=length(vW.xz-vec2(${ISLET.x.toFixed(1)},${ISLET.z.toFixed(1)}));
    float sh=max(max(smoothstep(sr+30.,sr-6.,d),smoothstep(sr2+28.,sr2-6.,d2)),smoothstep(34.,10.,di));
    float dn=min(d,d2);
    vec3 deep=vec3(.16,.42,.70),mid=vec3(.22,.58,.80),shc=vec3(.38,.80,.82);
    vec3 col=mix(deep,mid,smoothstep(280.,90.,dn));col=mix(col,shc,sh);
    float w1=sin(vW.x*.22+uT*.9)+sin(vW.z*.27-uT*.7)+sin((vW.x+vW.z)*.13+uT*.5);
    col+=smoothstep(2.25,2.85,w1)*.16;
    float foam=1.-smoothstep(0.,2.4,abs(d-(sr-6.)+sin(uT*1.6+a*9.)*.9));
    foam=max(foam,1.-smoothstep(0.,2.4,abs(d2-(sr2-6.)+sin(uT*1.6+a2*9.)*.9)));
    foam=max(foam,1.-smoothstep(0.,1.8,abs(di-11.+sin(uT*1.6+di)*.5)));
    col=mix(col,vec3(.96,.99,.99),foam*.35);
    vec2 mc=vec2(${((I1.x+I2.x)/2).toFixed(1)},${((I1.z+I2.z)/2).toFixed(1)});
    float fg=smoothstep(260.,700.,length(vW.xz-mc));col=mix(col,vec3(.85,.94,.95),fg);
    float al=mix(.74,.96,1.-sh);al*=1.-smoothstep(1000.,1500.,length(vW.xz-mc));
    gl_FragColor=vec4(col,al);
  }`
});
const water=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),waterMat);water.rotation.x=-Math.PI/2;water.renderOrder=1;scene.add(water);

/* helpers for plant groups */
const UPD=[];const PICK=[];const ANCHOR={};
function outwardYaw(x,z){return Math.atan2(x,z);}
function tagPick(group,id){group.traverse(o=>{if(o.isMesh){o.userData.pid=id;PICK.push(o);}});}
function puffs(parent,n,colorHex,opts){
  const arr=[];const g=new THREE.IcosahedronGeometry(1,0);
  for(let i=0;i<n;i++){const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:colorHex,flatShading:true,transparent:true,opacity:0,depthWrite:false,roughness:1}));parent.add(m);arr.push(m);}
  UPD.push(t=>{for(let i=0;i<n;i++){const a=(t*opts.rate+i/n)%1,m=arr[i];
    m.position.set(opts.x+a*opts.dx+Math.sin(t*.7+i)*.4,opts.y+a*opts.rise,opts.z+a*opts.dz);
    const s=opts.s0+a*opts.grow;m.scale.set(s,s,s);m.rotation.set(i,t*.2+i,0);m.material.opacity=opts.op*Math.sin(Math.PI*Math.min(1,a*1.2));}});
}

/* flowing-water material + ribbon geometry (used by the hydro dam) */
function flowMat(o){
  return new THREE.ShaderMaterial({
    transparent:true,depthWrite:false,side:THREE.DoubleSide,
    uniforms:{uT:{value:0},uSpeed:{value:o.speed},uDeep:{value:new THREE.Color(o.deep)},uFoam:{value:o.foam},uS:{value:new THREE.Vector2(o.scaleX,o.scaleY)},uA:{value:o.alpha},uE:{value:o.edge}},
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`uniform float uT,uSpeed,uFoam,uA,uE;uniform vec3 uDeep;uniform vec2 uS;varying vec2 vUv;
    float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
    float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
    void main(){
      vec2 p=vec2(vUv.x*uS.x,vUv.y*uS.y-uT*uSpeed*uS.y*.25);
      float s=n(p)*.6+n(p*2.3+3.1)*.4;
      float streak=smoothstep(.58,.9,n(vec2(vUv.x*uS.x*3.,vUv.y*uS.y*.35-uT*uSpeed*uS.y*.12)));
      vec3 col=mix(uDeep,vec3(.80,.93,1.),s*.45+streak*.55);
      float foam=uFoam*(smoothstep(.68,.9,vUv.y)*(1.-smoothstep(.97,1.,vUv.y)*.4)+smoothstep(.12,0.,vUv.y)*.5);
      col=mix(col,vec3(1.),clamp(foam*(.55+.6*s),0.,1.));
      float edge=uE>0.?smoothstep(0.,uE,vUv.x)*smoothstep(1.,1.-uE,vUv.x):1.;
      float fade=uFoam>0.?1.-smoothstep(.9,1.,vUv.y):1.;
      gl_FragColor=vec4(col,uA*(.82+.18*s)*edge*fade);
    }`
  });
}
function ribbon(pts,w0,w1){
  const pos=[],uv=[],idx=[],up=new THREE.Vector3(0,1,0),tg=new THREE.Vector3(),ac=new THREE.Vector3();
  let total=0;const L=[0];for(let i=1;i<pts.length;i++){total+=pts[i].distanceTo(pts[i-1]);L.push(total);}
  for(let i=0;i<pts.length;i++){
    const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];
    tg.subVectors(b,a).normalize();ac.crossVectors(tg,up);if(ac.lengthSq()<1e-6)ac.set(1,0,0);ac.normalize();
    const v=L[i]/total,w=(w0+(w1-w0)*v)/2;
    pos.push(pts[i].x-ac.x*w,pts[i].y-ac.y*w,pts[i].z-ac.z*w, pts[i].x+ac.x*w,pts[i].y+ac.y*w,pts[i].z+ac.z*w);
    uv.push(0,v,1,v);
    if(i<pts.length-1){const k=i*2;idx.push(k,k+1,k+2,k+1,k+3,k+2);}
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);
  return g;
}

/* HYDRO */
(function(){
  const S=SITES.hydro,g=new THREE.Group();g.position.set(S.x,S.h,S.z);g.rotation.y=outwardYaw(S.x,S.z);scene.add(g);
  const acc=mat(0x2d77c9);
  // plateau + full reservoir (water level = dam crest, so it spills over)
  mesh(new THREE.CylinderGeometry(12,15.5,12.2,8),mat(0x9a8d78),0,6.1,-6,g);
  mesh(new THREE.CylinderGeometry(12.05,12.2,.3,8),mat(0x7fae63),0,12.35,-6,g);
  const lakeMat=flowMat({speed:-.12,deep:0x2f7fd0,foam:0,scaleX:3,scaleY:3,alpha:.95,edge:0});
  const lake=new THREE.Mesh(new THREE.CircleGeometry(10.2,32),lakeMat);lake.rotation.x=-Math.PI/2;lake.position.set(0,12.56,-6.4);g.add(lake);

  // gravity dam: sloped downstream face (cross-section extruded across the valley)
  const DZ0=3.4,DZC=5.4,CREST=12.5,TOE=10.6;
  const faceZ=y=>DZC+(CREST-.2-y)*((TOE-DZC)/(CREST-.2));
  const sh=new THREE.Shape();sh.moveTo(DZ0,0);sh.lineTo(DZ0,CREST);sh.lineTo(DZC-.3,CREST);sh.quadraticCurveTo(DZC,CREST,DZC,CREST-.3);sh.lineTo(TOE,0);sh.closePath();
  const dg=new THREE.ExtrudeGeometry(sh,{depth:18,bevelEnabled:false});dg.rotateY(-Math.PI/2);dg.translate(9,0,0);
  mesh(dg,M.concrete,0,0,0,g);
  // crest rail (accent), split around the spillway
  [-5.7,5.7].forEach(x=>{mesh(new THREE.BoxGeometry(6.4,.5,.5),acc,x,CREST+.25,DZ0+.35,g);});
  // chute walls along the slope
  const slopeLen=Math.hypot(TOE-DZC,CREST),tilt=-Math.atan2(TOE-DZC,CREST);
  [-2.85,2.85].forEach(x=>{const w=mesh(new THREE.BoxGeometry(.45,slopeLen+.6,1.2),M.white,x,CREST/2,(DZC+TOE)/2+.15,g);w.rotation.x=tilt;});
  // penstock pipes down the face to the powerhouse
  [-5.2,-6.8].forEach(x=>{const p=mesh(new THREE.CylinderGeometry(.42,.42,slopeLen,10),M.metal,x,CREST/2-.2,(DZC+TOE)/2+.35,g);p.rotation.x=tilt;});

  // spillway sheet: follows crest, curls over the lip and runs down the face
  const cp=[new THREE.Vector3(0,CREST+.1,DZ0+.2),new THREE.Vector3(0,CREST+.12,DZC-.6),new THREE.Vector3(0,CREST-.15,DZC+.18)];
  for(let y=CREST-1.2;y>.6;y-=1.2)cp.push(new THREE.Vector3(0,y,faceZ(y)+.16));
  cp.push(new THREE.Vector3(0,.32,TOE+.7),new THREE.Vector3(0,.26,TOE+2.4),new THREE.Vector3(0,.24,TOE+3.6));
  const spillPts=new THREE.CatmullRomCurve3(cp).getPoints(90);
  const spillMat=flowMat({speed:1.9,deep:0x4a9fe6,foam:1,scaleX:8,scaleY:14,alpha:.92,edge:.1});
  const spill=new THREE.Mesh(ribbon(spillPts,5.3,5.3),spillMat);spill.renderOrder=2;g.add(spill);

  // river from the dam foot down to the sea (sampled on the terrain)
  g.updateMatrixWorld(true);
  const rv=[],wp=new THREE.Vector3();
  for(let z=TOE+3.2;z<70;z+=1){
    wp.set(Math.sin(z*.18)*1.6,0,z);g.localToWorld(wp);
    const th=heightAt(wp.x,wp.z);wp.y=Math.max(th,-.6)+.42;
    const lp=g.worldToLocal(wp.clone());rv.push(lp);
    if(th<-.6)break;
  }
  const riverMat=flowMat({speed:.9,deep:0x3f8fd6,foam:0,scaleX:4,scaleY:Math.max(6,rv.length/2),alpha:.9,edge:.18});
  riverMat.polygonOffset=true;riverMat.polygonOffsetFactor=-2;riverMat.polygonOffsetUnits=-2;
  const river=new THREE.Mesh(ribbon(rv,4.6,6),riverMat);river.renderOrder=2;g.add(river);

  // plunge pool: white foam rings, rising spray, splash droplets

  const v=viewFor(id);flyTo(v.pos,v.tgt,1.6);
  controls.minDistance=16;controls.autoRotate=false;
  const a=ANCHOR[id];const sh=id==='wind'?SITES.wind2.h:id==='tidal'?0:(SITES[id]&&SITES[id].pad!==false?SITES[id].h:0);
  ringPos.set(a.x,sh+.25,a.z);ringR=RING[id]||14;
  ringMat.color.set(p.color);
  requestAnimationFrame(sizeProc);
  if(first)setTimeout(()=>$('pClose').focus({preventScroll:true}),650);
}
function closePanel(){state.sel=null;app.classList.remove('is-open');controls.minDistance=24;}
function deselect(){
  if(!state.sel)return;SND.close();const id=state.sel.id;closePanel();
  flyTo(OVER[state.isl].pos.clone(),OVER[state.isl].tgt.clone(),1.5);idle=0;
  const d=dock.querySelector(`[data-id="${id}"]`);if(d)d.focus({preventScroll:true});
}
document.querySelectorAll('#isl button').forEach(b=>b.addEventListener('click',()=>{const n=+b.dataset.i;if(n!==state.isl||state.sel)switchIsland(n);}));
renderDock();

/* picking */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();let down=null;
canvas.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};idle=0;});
canvas.addEventListener('pointerup',e=>{
  if(!down)return;const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(moved>8)return;
  const r=canvas.getBoundingClientRect();ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);const hit=ray.intersectObjects(PICK,false)[0];
  if(hit)select(hit.object.userData.pid);
});
controls.addEventListener('start',()=>{idle=0;});

/* sizing + view offset */
const sheetMQ=matchMedia('(max-width:820px), (orientation:portrait) and (max-width:1100px)');
let VW=1,VH=1;const off={x:0,y:0};
function resize(){VW=innerWidth;VH=innerHeight;renderer.setSize(VW,VH,false);camera.aspect=VW/VH;camera.updateProjectionMatrix();
  OVER[1].pos.set(0,VW<VH?150:108,VW<VH?210:158);OVER[2].pos.set(I2.x,VW<VH?140:100,I2.z+(VW<VH?196:148));}
addEventListener('resize',resize);resize();

/* pins projection */
const tmpV=new THREE.Vector3();
function updatePins(){
  for(const id in PINS){const el=PINS[id];tmpV.copy(ANCHOR[id]).project(camera);
    const vis=BY[id].isl===state.isl&&tmpV.z<1&&Math.abs(tmpV.x)<1.1&&Math.abs(tmpV.y)<1.1;
    el.classList.toggle('off',!vis);
    if(vis){const x=(tmpV.x*.5+.5)*VW,y=(-tmpV.y*.5+.5)*VH;el.style.transform=`translate(${x}px,${y}px) translate(-50%,-100%)`;}}
  for(const n in IPINS){const el=IPINS[n];tmpV.copy(ISL_ANCHOR[n]).project(camera);
    const vis=tmpV.z<1&&Math.abs(tmpV.x)<1.05&&Math.abs(tmpV.y)<1.05;
    el.classList.toggle('off',!vis);el.classList.toggle('cur',+n===state.isl);
    if(vis){const x=(tmpV.x*.5+.5)*VW,y=(-tmpV.y*.5+.5)*VH;el.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`;}}
}

/* intro */
camera.position.set(-60,190,260);controls.target.copy(OVER[1].tgt);aimSun(1);
flyTo(OVER[1].pos.clone(),OVER[1].tgt.clone(),2.6);

/* ---------------------------------------------------------------
   SOUND: gentle generative background music + synthesized effects
--------------------------------------------------------------- */
const SND=(function(){
  let ctx=null,master,bgmBus,sfxBus,delay,noiseBuf,started=false,timer=null;
  let enabled=true;try{enabled=localStorage.getItem('energyIslandSound')!=='off';}catch(e){}
  const btn=document.getElementById('snd');
  function syncBtn(){btn.setAttribute('aria-pressed',enabled);btn.setAttribute('aria-label',enabled?'소리 끄기':'소리 켜기');}
  syncBtn();
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function init(){
    if(ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    ctx=new AC();
    master=ctx.createGain();master.gain.value=enabled?1:0;master.connect(ctx.destination);
    const comp=ctx.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=3;comp.connect(master);
    bgmBus=ctx.createGain();bgmBus.gain.value=.9;bgmBus.connect(comp);
    sfxBus=ctx.createGain();sfxBus.gain.value=.55;sfxBus.connect(comp);
    delay=ctx.createDelay(1);delay.delayTime.value=.42;const fb=ctx.createGain();fb.gain.value=.32;const dl=ctx.createBiquadFilter();dl.type='lowpass';dl.frequency.value=2200;
    delay.connect(dl);dl.connect(fb);fb.connect(delay);const wet=ctx.createGain();wet.gain.value=.35;dl.connect(wet);wet.connect(bgmBus);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  function unlock(){init();if(!ctx)return;if(ctx.state==='suspended')ctx.resume();started=true;}
  ['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,unlock,{capture:true,passive:true}));
  btn.addEventListener('click',()=>{enabled=!enabled;try{localStorage.setItem('energyIslandSound',enabled?'on':'off');}catch(e){}
    syncBtn();if(ctx){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(enabled?1:0,ctx.currentTime,.15);}if(enabled)blip(880,.12);});

  /* ---- primitives ---- */
  function tone(freq,t,dur,{type='sine',vol=.2,att=.01,bus=sfxBus,to=null,detune=0,send=0}={}){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);o.detune.value=detune;
    if(to)o.frequency.exponentialRampToValueAtTime(to,t+dur);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(bus);if(send){const s=ctx.createGain();s.gain.value=send;g.connect(s);s.connect(delay);}
    o.start(t);o.stop(t+dur+.05);
  }
  function noise(t,dur,{type='bandpass',f0=800,f1=null,q=1,vol=.3,att=.05,bus=sfxBus}={}){
    const n=ctx.createBufferSource();n.buffer=noiseBuf;n.loop=true;const f=ctx.createBiquadFilter();f.type=type;f.Q.value=q;
    f.frequency.setValueAtTime(f0,t);if(f1)f.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    n.connect(f);f.connect(g);g.connect(bus);n.start(t,Math.random());n.stop(t+dur+.05);
  }
  const now=()=>ctx.currentTime+.01;
  function blip(f,vol){if(!ctx)return;tone(f,now(),.14,{type:'triangle',vol:vol||.14,att:.005});}

  /* ---- background music ---- */
  // F – C – Dm – B♭, slow and bright; soft pads, a sparse marimba melody and a faint sea wash
  const CH=[[53,57,60,64],[48,55,60,64],[50,57,60,65],[46,53,58,62]];
  const PENTA=[65,67,69,72,74,77,79,81];
  const BEAT=60/78,BAR=BEAT*4,CHORD=BAR*2;
  let nextT=0,step=0;
  function pad(notes,t,dur){
    notes.forEach((m,i)=>{[0,7].forEach(dt=>{const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
      o.type=i===0?'sine':'triangle';o.frequency.value=mtof(m);o.detune.value=dt*(i%2?1:-1);f.type='lowpass';f.frequency.value=1300;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.032,t+1.6);g.gain.setValueAtTime(.032,t+dur-1.2);g.gain.linearRampToValueAtTime(0,t+dur+.8);
      o.connect(f);f.connect(g);g.connect(bgmBus);o.start(t);o.stop(t+dur+1);});});
    tone(mtof(notes[0]-12),t,dur*.9,{vol:.07,att:.4,bus:bgmBus});
  }
  function mallet(m,t,v){tone(mtof(m),t,.9,{vol:v,att:.006,bus:bgmBus,send:.55});tone(mtof(m)*4,t,.18,{vol:v*.18,att:.003,bus:bgmBus});}
  function sea(){
    const n=ctx.createBufferSource();n.buffer=noiseBuf;n.loop=true;const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=520;
    const g=ctx.createGain();g.gain.value=.025;const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=.09;lg.gain.value=.02;lfo.connect(lg);lg.connect(g.gain);
    n.connect(f);f.connect(g);g.connect(bgmBus);n.start();lfo.start();
  }
  function schedule(){
    while(nextT<ctx.currentTime+1.2){
      const ci=Math.floor(step/16)%CH.length,within=step%16,t=nextT;
      if(within===0)pad(CH[ci],t,CHORD);
      const r=hash(step,77);
      if(within%2===0&&r<.5){const chordTones=CH[ci].map(m=>m+12);const pool=r<.22?chordTones:PENTA;const m=pool[Math.floor(hash(step,78)*pool.length)];mallet(m,t,.06+hash(step,79)*.04);}
      if(within===14&&r<.6)mallet(PENTA[Math.floor(hash(step,80)*PENTA.length)],t,.04);
      nextT+=BEAT/2;step++;
    }
  }
  function startBgm(){nextT=ctx.currentTime+.3;sea();bgmBus.gain.setTargetAtTime(.9,ctx.currentTime,1.5);schedule();timer=setInterval(schedule,250);}
  document.addEventListener('visibilitychange',()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else if(started)ctx.resume();});

  /* ---- effects ---- */
  const SIG={
    thermal(t){for(let i=0;i<22;i++)noise(t+Math.random()*1.2,.04,{type:'highpass',f0:1800,q:.7,vol:.25*Math.random()});noise(t,1.3,{type:'lowpass',f0:300,vol:.18,att:.2});},
    nuclear(t){tone(110,t,1.4,{type:'sawtooth',vol:.05,att:.3});tone(220.5,t,1.4,{type:'sine',vol:.05,att:.3});for(let i=0;i<9;i++)noise(t+.1+i*.13+Math.random()*.05,.02,{type:'highpass',f0:3000,vol:.22});},
    hydro(t){noise(t,1.6,{type:'bandpass',f0:500,f1:1400,q:.6,vol:.35,att:.25});noise(t+.3,1.3,{type:'lowpass',f0:250,vol:.25,att:.3});},
    wind(t){noise(t,1.8,{type:'bandpass',f0:300,f1:900,q:2.5,vol:.35,att:.5});noise(t+.5,1.4,{type:'bandpass',f0:700,f1:350,q:3,vol:.2,att:.4});},
    geo(t){for(let i=0;i<8;i++){const tt=t+i*.14+Math.random()*.06;tone(240+Math.random()*200,tt,.12,{vol:.12,to:700+Math.random()*400});}noise(t,1.2,{type:'lowpass',f0:180,vol:.2,att:.3});},
    tidal(t){noise(t,2,{type:'lowpass',f0:350,f1:900,vol:.32,att:.9});noise(t+.9,1.2,{type:'bandpass',f0:1200,f1:500,q:.6,vol:.18,att:.15});},
    pv(t){[84,88,91,96,100].forEach((m,i)=>tone(mtof(m),t+i*.07,.9,{vol:.06,att:.004,send:.4}));},
    st(t){tone(mtof(57),t,1.4,{type:'triangle',vol:.08,att:.5,to:mtof(69)});[81,84,88].forEach((m,i)=>tone(mtof(m),t+.5+i*.08,.8,{vol:.05,send:.4}));},
    bio(t){for(let i=0;i<10;i++){const tt=t+i*.11+Math.random()*.05;tone(180+Math.random()*120,tt,.1,{vol:.13,to:420+Math.random()*200});}},
    wave(t){noise(t,1.1,{type:'lowpass',f0:400,f1:2600,vol:.35,att:.7});noise(t+1,1,{type:'highpass',f0:1800,f1:600,vol:.18,att:.03});},
    stream(t){noise(t,1.8,{type:'bandpass',f0:380,q:1.5,vol:.3,att:.4});for(let i=0;i<5;i++)tone(300+i*40,t+.2+i*.2,.25,{vol:.05,to:520+i*40});},
    h2(t){for(let i=0;i<6;i++)tone(700+Math.random()*500,t+i*.09,.08,{vol:.08,to:1600});[79,83,86].forEach((m,i)=>tone(mtof(m),t+.6+i*.06,.7,{vol:.05,send:.4}));}
  };
  function whoosh(t,dur,up){noise(t,dur,{type:'bandpass',f0:up?250:1600,f1:up?1600:250,q:.9,vol:.22,att:dur*.45});}
  function chime(t,notes,v){notes.forEach((m,i)=>tone(mtof(m),t+i*.07,1.1,{type:'sine',vol:v||.07,att:.005,send:.5}));}
  function zap(t){[79,84,88,91,96].forEach((m,i)=>tone(mtof(m),t+i*.055,.55,{type:'sine',vol:.07,att:.004,send:.45}));tone(mtof(72),t,.5,{type:'triangle',vol:.05,att:.02,to:mtof(84)});}
  const api={
    select(id,elecStep){if(!ctx||!enabled)return;const t=now();whoosh(t,.7,true);chime(t+.25,[72,76,79]);if(SIG[id])SIG[id](t+.45);},
    island(n){if(!ctx||!enabled)return;const t=now();whoosh(t,1.6,true);chime(t+.9,n===2?[74,78,81,86]:[72,76,79,84],.06);},
    close(){if(!ctx||!enabled)return;const t=now();whoosh(t,.6,false);tone(mtof(76),t,.25,{type:'triangle',vol:.08,to:mtof(67)});},
    step(i,elec){if(!ctx||!enabled)return;const t=now();
      if(i===5){chime(t,[72,76,79,84],.07);return;}
      tone(mtof([67,69,72,74,76][i]),t,.35,{type:'triangle',vol:.1,att:.004,send:.25});
      if(elec)zap(t+.15);},
    click(){if(ctx&&enabled)blip(660,.08);}
  };
  return api;
})();

/* loop */
let last=performance.now(),clock=0,idle=0;const STEP_DUR=5.2,ALL_DUR=7;
const pProg=$('pProg');
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;clock+=dt;idle+=dt;
  waterMat.uniforms.uT.value=clock;
  UPD.forEach(f=>f(clock,dt));
  if(tween){tween.t+=dt/tween.dur;const u=Math.min(1,tween.t),e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    camera.position.lerpVectors(tween.p0,tween.p1,e);controls.target.lerpVectors(tween.t0,tween.t1,e);
    if(u>=1){tween=null;controls.enabled=true;}}
  controls.autoRotate=!reduced&&!state.sel&&!tween&&idle>7;
  if(controls.enabled)controls.update();else camera.lookAt(controls.target);
  // view offset to keep the subject clear of the panel
  let tx=0,ty=0;
  if(state.sel){const pr=$('panel').getBoundingClientRect();if(sheetMQ.matches)ty=Math.min(pr.height,VH*.7)*.5;else tx=(pr.width+14)*.5;}
  off.x+=(tx-off.x)*Math.min(1,dt*4);off.y+=(ty-off.y)*Math.min(1,dt*4);
  if(Math.abs(off.x)>.5||Math.abs(off.y)>.5)camera.setViewOffset(VW,VH,off.x,off.y,VW,VH);else camera.clearViewOffset();
  // selection ring
  const ro=state.sel?.8:0;ringMat.opacity+=(ro*(.6+.4*Math.sin(clock*3))-ringMat.opacity)*Math.min(1,dt*5);
  selRing.position.copy(ringPos);const rs=ringR*(1+.06*Math.sin(clock*2));selRing.scale.set(rs,rs,rs);
  renderer.render(scene,camera);
  updatePins();
  // panel animation
  if(state.sel){
    T+=dt;DT=dt;
    if(state.playing){state.stepT+=dt;const dur=state.step===5?ALL_DUR:STEP_DUR;pProg.style.width=Math.min(100,state.stepT/dur*100)+'%';
      if(state.stepT>=dur)setStep(state.step===5?0:state.step+1);}
    else pProg.style.width='0%';
    drawProc();
  }
}
requestAnimationFrame(t=>{last=t;document.getElementById('loading').classList.add('done');loop(t);});
})();
</script>
